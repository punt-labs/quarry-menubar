name: swift-default
description: Advisory Swift and shell feedback on edit, staged Swift checks at commit, and the full gate at handoff.
checks:
  - name: swiftformat
    stage: edit
    files: ["QuarryMenuBar/**/*.swift", "QuarryMenuBarTests/**/*.swift"]
    run: [swiftformat, "{file}", --lint]
    on_fail: advisory
    timeout: 5s
  - name: swiftlint
    stage: edit
    files: ["QuarryMenuBar/**/*.swift", "QuarryMenuBarTests/**/*.swift"]
    run: [swiftlint, lint, --config, .punt-labs/ethos/swiftlint-paths.yml, --strict, --quiet, --force-exclude, "{file}"]
    on_fail: advisory
    timeout: 5s
  - name: shellcheck
    stage: edit
    files: ["**/*.sh"]
    run: [shellcheck, "{file}"]
    on_fail: advisory
    timeout: 5s
  - name: swiftformat-staged
    stage: commit
    files: ["QuarryMenuBar/**/*.swift", "QuarryMenuBarTests/**/*.swift"]
    run: [swiftformat, "{files}", --lint]
    on_fail: block
  - name: swiftlint-staged
    stage: commit
    files: ["QuarryMenuBar/**/*.swift", "QuarryMenuBarTests/**/*.swift"]
    run: [swiftlint, lint, --config, .punt-labs/ethos/swiftlint-paths.yml, --quiet, --force-exclude, "{files}"]
    on_fail: block
  - name: full-gate
    stage: handoff
    files: all
    adapter: make
    target: check
    on_fail: block
    timeout: 20m
